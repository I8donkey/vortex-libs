name: Validate & Merge
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  validate:
    name: Validate & Sync
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Check and generate
        id: check
        shell: bash
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ERR_FILE: ${{ runner.temp }}/errors.txt
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          python3 - <<'PY'
          import os, sys, json, subprocess, tomllib
          errs, libs, to_write = [], set(), []
          def err(m): errs.append(m); print(f"::error::{m}")
          base, head = os.environ["BASE_REF"], os.environ["HEAD_SHA"] if os.environ["SAME_REPO"] != "true" else "HEAD"
          files = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", f"origin/{base}...{head}"], text=True).splitlines()
          if not files: err("PR contains no changes.")
          prefix = f"libs/{os.environ['AUTHOR']}/".lower()
          for f in files:
              if not f.lower().startswith(prefix): err(f"'{f}' is outside '{prefix}'."); continue
              parts = f[len(prefix):].split("/")
              if len(parts) < 2: err(f"'{f}' must be under '{prefix}<lib>/'."); continue
              libs.add(f"{f[:len(prefix)]}{parts[0]}")
          FIELDS = ["name", "author", "version", "description", "link", "license"]
          get_mtime = lambda p: int(subprocess.check_output(["git", "log", "-1", "--format=%ct", "--", p], text=True, stderr=subprocess.DEVNULL).strip() or 0)
          def load(p, is_toml):
              try:
                  d = tomllib.load(open(p, "rb")) if is_toml else json.load(open(p, encoding="utf-8"))
                  low = {k.lower(): v for k, v in d.items()}
                  out = {f: low[f] for f in FIELDS if f in low and str(low[f]).strip()}
                  for f in FIELDS:
                      if f not in out: err(f"{p}: missing/empty '{f}'.")
                  return out
              except Exception as e: err(f"{p}: parse error ({e}).")
          for lib in libs:
              if not os.path.isdir(lib): continue
              if not any(e.startswith("LICENSE") for e in os.listdir(lib)): err(f"{lib}: missing LICENSE.")
              tp, jp = os.path.join(lib, "lib.toml"), os.path.join(lib, "lib.json")
              has_t, has_j = os.path.isfile(tp), os.path.isfile(jp)
              if not has_t and not has_j: err(f"{lib}: missing lib.toml/json."); continue
              t_data = load(tp, True) if has_t else None
              j_data = load(jp, False) if has_j else None
              src = t_data if (t_data and j_data and get_mtime(tp) >= get_mtime(jp)) else (j_data if j_data else t_data)
              if src and src != j_data: to_write.append((jp, src))
          if errs:
              open(os.environ["ERR_FILE"], "w").write("\n".join(errs))
              sys.exit(1)
          for p, d in to_write:
              json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print(f"::notice::Wrote {p}")
          PY
          if [ -n "$(git status --porcelain)" ]; then
            [ "$SAME_REPO" != "true" ] && echo "Fork PR cannot auto-generate." > "$ERR_FILE" && exit 1
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add libs/ && git commit -m "chore: sync lib.json" && git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Comment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.check.outcome }}
          ERR_FILE: ${{ runner.temp }}/errors.txt
        run: |
          BODY="$RUNNER_TEMP/c.md"
          if [ "$RESULT" = "success" ]; then
            printf '## ✅ Validation passed\n\nAll checks passed and `lib.json` is in sync. Merging automatically.\n' > "$BODY"
          else
            printf '## ❌ Validation failed\n\nPlease fix the issues.\n\n### Errors\n' > "$BODY"
            [ -s "$ERR_FILE" ] && sed 's/^/- /' "$ERR_FILE" >> "$BODY" || echo "- Check logs." >> "$BODY"
            printf '\n### Requirements\n- Path: `libs/<username>/<library>/`\n- Include `LICENSE` & `lib.toml` or `lib.json`\n- Fields: `Name`, `Author`, `Version`, `Description`, `Link`, `License`\n' >> "$BODY"
          fi
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$BODY"
  merge:
    name: Auto-Merge
    needs: [validate]
    if: ${{ !github.event.pull_request.draft && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "${{ github.repository }}" --squash --auto --delete-branch
