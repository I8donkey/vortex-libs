name: Validate & Merge
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate & Sync
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Check and generate
        id: check
        shell: bash
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ERR_FILE: ${{ runner.temp }}/errors.txt
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          
          python3 - <<'PY'
          import os, sys, json, subprocess, tomllib
          author, base_ref = os.environ["AUTHOR"], os.environ["BASE_REF"]
          same_repo = os.environ["SAME_REPO"] == "true"
          head_sha = os.environ["HEAD_SHA"]
          err_file = os.environ["ERR_FILE"]
          errors = []
          def err(m): errors.append(m); print(f"::error::{m}")
          diff_range = f"origin/{base_ref}...{'HEAD' if same_repo else head_sha}"
          files = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", diff_range], text=True).splitlines()
          if not files: err("PR contains no file changes.")
          prefix = f"libs/{author}/".lower()
          libs = set()
          for f in files:
              if not f.lower().startswith(prefix): err(f"'{f}' is outside '{prefix}'."); continue
              parts = f[len(prefix):].split("/")
              if len(parts) < 2: err(f"'{f}' must be under '{prefix}<lib>/'."); continue
              libs.add(f"{f[:len(prefix)]}{parts[0]}")
          FIELDS = ["name", "author", "version", "description", "link", "license"]
          to_write = []
          
          for lib in libs:
              if not os.path.isdir(lib):
                  print(f"::warning::{lib}: directory not found on disk, skip.")
                  continue
              if not any(e.startswith("LICENSE") for e in os.listdir(lib)): err(f"{lib}: missing LICENSE.")
              
              tp, jp = os.path.join(lib, "lib.toml"), os.path.join(lib, "lib.json")
              has_t, has_j = os.path.isfile(tp), os.path.isfile(jp)
              if not has_t and not has_j: err(f"{lib}: missing lib.toml/json."); continue
              
              def norm(d, where):
                  low = {k.lower(): v for k, v in d.items()}
                  out = {f: low[f] for f in FIELDS if f in low and str(low[f]).strip()}
                  for f in FIELDS:
                      if f not in out: err(f"{where}: missing/empty '{f}'.")
                  return out
              t_data = j_data = None
              if has_t:
                  try:
                      t_data = norm(tomllib.load(open(tp, "rb")), f"{lib}/lib.toml")
                      print(f"::notice::{lib}: parsed lib.toml -> {t_data}")
                  except Exception as e: err(f"{lib}/lib.toml: parse error ({e}).")
              if has_j:
                  try:
                      j_data = norm(json.load(open(jp, encoding="utf-8")), f"{lib}/lib.json")
                  except Exception as e: err(f"{lib}/lib.json: parse error ({e}).")
              if t_data is not None:
                  if t_data != j_data:
                      to_write.append((jp, t_data))
                      print(f"::notice::{lib}: lib.json will be (re)generated from lib.toml")
                  else:
                      print(f"::notice::{lib}: lib.json already in sync")
              else:
                  print(f"::notice::{lib}: no valid lib.toml, nothing to generate")
          if errors:
              open(err_file, "w").write("\n".join(errors))
              print("::error::Validation failed; lib.json will NOT be written.")
              sys.exit(1)
          for p, d in to_write:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print(f"::notice::Wrote {p}")
          PY
          
          if [ -n "$(git status --porcelain)" ]; then
            if [ "$SAME_REPO" != "true" ]; then
              echo "Fork PR cannot auto-generate lib.json." > "$ERR_FILE"
              echo "::error::Cannot push to a fork."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add libs/
            git commit -m "chore: sync lib.json"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Comment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}  # 回归默认 token，同仓库完全够用
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.check.outcome }}
          ERR_FILE: ${{ runner.temp }}/errors.txt
        run: |
          BODY="$RUNNER_TEMP/comment.md"
          
          if [ "$RESULT" = "success" ]; then
            printf '## ✅ Validation passed\n\nAll checks passed and `lib.json` is in sync. Merging automatically.\n' > "$BODY"
          else
            printf '## ❌ Validation failed\n\nPlease fix the issues and push again.\n\n### Errors\n' > "$BODY"
            if [ -s "$ERR_FILE" ]; then sed 's/^/- /' "$ERR_FILE" >> "$BODY"; else echo "- Check job logs." >> "$BODY"; fi
            cat <<'EOF' >> "$BODY"
          
          ### Requirements
          - Path must be `libs/<username>/<library>/`
          - Must include `LICENSE` and `lib.toml` or `lib.json`
          - Fields: `Name`, `Author`, `Version`, `Description`, `Link`, `License`
          EOF
          fi
          
          # 使用原生的 gh pr comment，彻底告别 404 和复杂转义
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$BODY"

  merge:
    name: Auto-Merge
    needs: [validate]
    if: ${{ !github.event.pull_request.draft && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "::group::PR state"
          gh pr view "$PR" --repo "${{ github.repository }}" --json state,mergeable,mergeStateStatus || true
          echo "::endgroup::"
          
          # 使用 --auto 解决 Required Status Checks 带来的死锁
          # --auto 会在当前 check 跑完并显示 success 后，自动执行合并
          gh pr merge "$PR" --repo "${{ github.repository }}" --squash --auto --delete-branch
